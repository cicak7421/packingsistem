<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Flowmua</title>
<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>(function(){try{var t=localStorage.getItem("flowmua_theme");if(!t)t="dark";if(t==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}})()</script>
<link rel="stylesheet" href="css/style.css?v=d1d03751">
<!-- Font dimuat NON-blocking (tampilan langsung muncul pakai font sistem, lalu ganti mulus begitu font siap) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"></noscript>

</head>
<body>
<div class="auth-wrap">
  <aside class="auth-aside">
    <span class="float-box fb1" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/><path d="m7.5 5.5 9 5"/></svg></span><span class="float-box fb2" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/><path d="m7.5 5.5 9 5"/></svg></span><span class="float-box fb3" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/><path d="m7.5 5.5 9 5"/></svg></span>
    <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/><path d="m7.5 5.5 9 5"/></svg></span> Flowmua</div>
    <div>
      <h2>Dari import sampai paket terkirim.</h2>
      <p>Satu tempat buat CS dan tim packing: import pesanan marketplace, scan resi, cek status, dan pantau stok.</p>
    </div>
    <div class="auth-flow"><span>Import</span><i></i><span>Packing</span><i></i><span>Dikirim</span></div>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <div class="brand" style="display:flex;"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/><path d="m7.5 5.5 9 5"/></svg></span> Flowmua</div>
      <h1>Masuk</h1>
      <p class="auth-sub">Pakai akun yang dibuat admin.</p>
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Username kamu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="Password kamu" autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password" title="Tampilkan / sembunyikan password">
          <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.6 10.6 0 0 1 12 19c-6.4 0-10-7-10-7a17.7 17.7 0 0 1 4.1-4.9"/><path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17.8 17.8 0 0 1-2.2 3.2"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <div class="error-msg" id="errorMsg" style="display:none;" role="alert"></div>
      <button class="btn" id="loginBtn" onclick="doLogin()" style="margin-top:6px;">Masuk</button>
    </div>
  </main>
</div>

<script src="js/api.js?v=db9a8ac9"></script>
<script src="js/ui.js?v=df619c76"></script>
<script>
// Kalau sudah login, langsung redirect sesuai role
(function() {
  const user = getUser();
  if (getToken() && user) redirectByRole(user.role);
})();

function goTo(url) { if (window.flowmuaGo) window.flowmuaGo(url); else window.location.href = url; }
function redirectByRole(role) {
  if (role === 'admin' || role === 'cs') goTo('/dashboard.html');
  else if (role === 'packing') goTo('/packing.html');
  else if (role === 'inventory') goTo('/inventory.html');
  else { clearSession(); showLoginError('Role akun tidak dikenali, hubungi admin.'); }
}

function showLoginError(msg) {
  const errBox = document.getElementById('errorMsg');
  errBox.textContent = msg;
  errBox.style.display = 'block';
}

let loggedIn = false;
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('errorMsg');
  const btn = document.getElementById('loginBtn');
  errBox.style.display = 'none';

  if (!username || !password) {
    errBox.textContent = 'Username dan password wajib diisi';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Memproses...';
  try {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    setSession(data.token, data.user);
    loggedIn = true;
    btn.textContent = 'Masuk...';
    redirectByRole(data.user.role);
  } catch (e) {
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  } finally {
    if (!loggedIn) { btn.disabled = false; btn.textContent = 'Masuk'; }
  }
}

document.getElementById('pwToggle').addEventListener('click', function () {
  const inp = document.getElementById('password');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  this.classList.toggle('on', show);
  this.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
  inp.focus();
});

document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
